<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Market Cloud</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="app-header">
        <div class="brand">
          <span class="market-state" id="marketState">장중 흐름</span>
          <h1>Market Cloud</h1>
        </div>
        <div class="toolbar" aria-label="대시보드 설정">
          <button class="icon-btn" id="themeButton" type="button" title="테마 전환">◐</button>
          <div class="segmented" role="group" aria-label="크기 기준">
            <button class="active" data-map-metric="market_cap" type="button">시총</button>
            <button data-map-metric="trading_value" type="button">거래대금</button>
          </div>
          <div class="segmented" role="group" aria-label="색상 기준">
            <button class="active" data-color-metric="change_rate" type="button">등락률</button>
            <button data-color-metric="volatility" type="button">변동성</button>
          </div>
        </div>
      </header>

      <main class="dashboard">
        <section class="map-panel" aria-label="시장 맵">
          <div class="panel-head">
            <div>
              <span class="label" id="mapScope">전체 시장</span>
              <h2 id="mapTitle">섹터별 시장 맵</h2>
            </div>
            <button class="text-btn" id="backButton" type="button" hidden>전체 시장</button>
          </div>

          <div class="summary-strip" id="summaryStrip"></div>
          <div class="map-legend">
            <span><i class="up-dot"></i> 상승</span>
            <span><i class="down-dot"></i> 하락</span>
            <span><i class="risk-dot"></i> 확인 필요</span>
          </div>
          <div class="treemap" id="treemap" aria-live="polite"></div>
        </section>

        <aside class="insight-panel" aria-label="인사이트">
          <div class="panel-head compact">
            <div>
              <span class="label" id="insightScope">MARKET</span>
              <h2 id="insightTitle">시장 요약</h2>
            </div>
          </div>
          <div class="headline" id="headline"></div>
          <div class="insight-rows" id="insightRows"></div>
          <div class="issue-keywords" id="issueKeywords"></div>
        </aside>
      </main>

      <section class="overview-panel" id="overviewPanel" hidden aria-label="종목 Overview">
        <div class="overview-head">
          <div>
            <span class="label" id="overviewSector">종목 Overview</span>
            <h2 id="overviewName"></h2>
            <p id="overviewMeta"></p>
          </div>
          <div class="quote" id="overviewQuote"></div>
        </div>
        <div class="overview-body">
          <div class="compact-kpis" id="stockKpis"></div>
          <div class="chart-panel">
            <div class="chart-head">
              <strong>가격 흐름</strong>
              <div class="period-tabs" role="group" aria-label="차트 기간">
                <button data-period="1D" type="button">1D</button>
                <button data-period="1W" type="button">1W</button>
                <button class="active" data-period="1M" type="button">1M</button>
                <button data-period="3M" type="button">3M</button>
                <button data-period="1Y" type="button">1Y</button>
              </div>
            </div>
            <canvas id="priceChart" width="860" height="320"></canvas>
          </div>
          <div class="related-news" id="stockNews"></div>
        </div>
      </section>

      <section class="news-band" aria-label="뉴스 및 공시">
        <div class="news-band-head">
          <strong>뉴스·공시</strong>
          <span id="newsContext">전체 시장</span>
        </div>
        <div class="news-list" id="newsList"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
